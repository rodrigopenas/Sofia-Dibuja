
name: Compilar Sofia Dibuja APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 33
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Dibuja-APK
          path: app/build/outputs/apk/debug/*.apk
